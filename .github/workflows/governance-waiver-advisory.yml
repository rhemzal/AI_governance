# Kit-repo dogfood: waiver block advisory when governance-waiver label is set.
# Adopters: copy/adapt from usage/CI_STARTER_WORKFLOWS.md §6 — inline CI only.
name: governance-waiver-advisory

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: governance-waiver-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waiver:
    if: contains(github.event.pull_request.labels.*.name, 'governance-waiver')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require waiver block in PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 - "$PR_BODY" <<'PY'
          import re
          import sys
          from datetime import date
          body = sys.argv[1]
          placeholders = {"yes/no", "tbd", "todo", "n/a", "na", "none", "later", "...", "-", "yyyy-mm-dd"}
          required = (
              ("gate id", "Gate ID"),
              ("owner", "Owner"),
              ("expiration", "Expiration"),
              ("compensating control", "Compensating control"),
          )
          def heading(line):
              match = re.match(r"^(#{1,6})\s+(.*?)\s*$", line)
              return (len(match.group(1)), match.group(2)) if match else None
          def section(pattern):
              lines = body.splitlines()
              start = level = None
              for index, line in enumerate(lines):
                  found = heading(line)
                  if found and re.fullmatch(pattern, found[1], re.IGNORECASE):
                      start, level = index + 1, found[0]
                      break
              if start is None:
                  return None
              end = len(lines)
              for index in range(start, len(lines)):
                  found = heading(lines[index])
                  if found and found[0] <= level:
                      end = index
                      break
              return lines[start:end]
          def meaningful(raw):
              return "" if raw.casefold().rstrip(".") in placeholders else raw
          lines = section(r"Governance waiver(?:\s+\([^)]*\))?")
          if lines is None:
              print("::warning::PR has governance-waiver label but no Governance waiver section (see usage/GOVERNANCE_WAIVERS.md)")
              raise SystemExit(0)
          found = {}
          for line in lines:
              text = re.sub(r"^\s*[-*]\s*", "", line).strip().replace("**", "")
              if ":" not in text:
                  continue
              label, raw = text.split(":", 1)
              found[label.strip().casefold()] = raw.strip()
          for key, label in required:
              raw = found.get(key, "")
              if key == "expiration":
                  try:
                      date.fromisoformat(raw)
                      ok = True
                  except ValueError:
                      ok = False
              else:
                  ok = bool(meaningful(raw))
              if not ok:
                  print(f"::warning::Waiver block missing value: {label}")
          PY
