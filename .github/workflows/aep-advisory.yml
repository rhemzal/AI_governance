# Missing declarations are advisory; declared plans receive structural validation.
# Copy the validator and workflow from the same kit revision (usage/AEP_VALIDATION.md).
name: aep-advisory

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: aep-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the reference validator
        run: timeout 60s python3 -m unittest discover -s ci/tests -v

      - name: Count changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          COUNT="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | wc -l | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Validate AEP declaration (all PRs)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ steps.diff.outputs.count }}
        run: python3 ci/validate_aep.py --changed-files "$CHANGED_FILES"
