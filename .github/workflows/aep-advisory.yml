# Missing declarations are advisory; declared plans receive structural validation.
# Copy the validator and workflow from the same kit revision (usage/AEP_VALIDATION.md).
# paths-ignore: skip doc-only PRs (same exemptions as doc-delta run block); see DEVELOPMENT.md.
name: aep-advisory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "usage/**"
      - "adr/**"
      - "governance/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: aep-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Count changed files
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          COUNT="$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if printf '%s\n' "$CHANGED" | grep -qE '^ci/(validate_aep\.py|tests/)'; then
            echo "run_validator_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_validator_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the reference validator
        if: steps.diff.outputs.run_validator_tests == 'true'
        run: timeout 60s python3 -m unittest discover -s ci/tests -v

      - name: Validate AEP declaration (all PRs)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ steps.diff.outputs.count }}
        run: python3 ci/validate_aep.py --changed-files "$CHANGED_FILES"
