# Kit-repo dogfood: DOC DELTA advisory for non-doc-only PRs.
# Adopters: copy/adapt from usage/CI_STARTER_WORKFLOWS.md §7 — inline CI only.
# paths-ignore: skip doc-only PRs; PR description edits use synchronize after a push.
name: doc-delta-advisory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "usage/**"
      - "adr/**"
      - "governance/**"
      - ".github/workflows/**"

concurrency:
  group: doc-delta-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn when code paths change without DOC DELTA
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"
          HEAD="$HEAD_SHA"
          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          # Doc-only prefixes (adapt for your repo). A mention outside the section does not count.
          NON_DOC="$(echo "$CHANGED" | grep -Ev '^(.*\.md$|docs/|usage/|adr/|\.github/workflows/|governance/)' || true)"
          if [ -z "$NON_DOC" ]; then
            echo "Doc-only or governance-workflow change; DOC DELTA not required."
            exit 0
          fi
          if python3 - "$PR_BODY" <<'PY'
          import re
          import sys
          body = sys.argv[1]
          placeholders = {"yes/no", "tbd", "todo", "n/a", "na", "none", "later", "...", "-", "yyyy-mm-dd"}
          def heading(line):
              match = re.match(r"^(#{1,6})\s+(.*?)\s*$", line)
              return (len(match.group(1)), match.group(2)) if match else None
          def section(pattern):
              lines = body.splitlines()
              start = level = None
              for index, line in enumerate(lines):
                  found = heading(line)
                  if found and re.fullmatch(pattern, found[1], re.IGNORECASE):
                      start, level = index + 1, found[0]
                      break
              if start is None:
                  return None
              end = len(lines)
              for index in range(start, len(lines)):
                  found = heading(lines[index])
                  if found and found[0] <= level:
                      end = index
                      break
              return lines[start:end]
          def value(line):
              text = re.sub(r"^\s*[-*]\s*", "", line).strip().replace("**", "")
              if not text:
                  return ""
              if ":" in text:
                  content = text.split(":", 1)[1].strip()
              elif text.endswith("?"):
                  return ""
              else:
                  content = text
              if content.casefold().rstrip(".") in placeholders:
                  return ""
              return content
          lines = section(r"DOC DELTA")
          raise SystemExit(0 if lines and any(value(line) for line in lines) else 1)
          PY
          then
            echo "DOC DELTA present."
            exit 0
          fi
          echo "::warning::Non-doc paths changed without a populated DOC DELTA section (ci/DOC_GATES.md D2; see usage/GOVERNANCE_WAIVERS.md if deferred)"
