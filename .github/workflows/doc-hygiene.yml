# Kit-repo reference implementation for ci/DOC_GATES.md (CM0 doc hygiene; maintainer dogfood).
# Adopters: copy/adapt inline steps from usage/CI_STARTER_WORKFLOWS.md — no repository scripts.
name: doc-hygiene

on:
  pull_request:
    paths:
      - '**.md'
      - 'kit-manifest.yml'
      - '.github/**'
      - 'governance/**'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'kit-manifest.yml'
      - '.github/**'
      - 'governance/**'

concurrency:
  group: doc-hygiene-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yq
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Required root meta files exist
        run: |
          set -euo pipefail
          for f in README.md kit-manifest.yml VERSIONING.md DEVELOPMENT.md CHANGELOG.md; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Manifest explicit paths exist
        run: |
          set -euo pipefail
          check_paths() {
            local bundle="$1"
            yq -r ".bundles.${bundle}.paths[]? // empty" kit-manifest.yml | while IFS= read -r p; do
              [ -z "$p" ] && continue
              if [[ "$p" == */ ]]; then
                test -d "${p%/}" || { echo "Missing directory ($bundle): $p"; exit 1; }
              else
                test -e "$p" || { echo "Missing path ($bundle): $p"; exit 1; }
              fi
            done
          }
          for bundle in minimal standard architecture research full; do
            check_paths "$bundle"
          done

      - name: Bundled cross-refs (checklist item 3)
        run: |
          set -euo pipefail
          MANIFEST=kit-manifest.yml
          ALLOWLIST='README.md CONTRIBUTING.md'

          bundle_paths() {
            local bundle="$1"
            case "$bundle" in
              minimal)
                yq -r '.bundles.minimal.paths[]' "$MANIFEST"
                ;;
              standard)
                yq -r '.bundles.minimal.paths[], .bundles.standard.paths[]' "$MANIFEST"
                ;;
              full)
                yq -r '.bundles.minimal.paths[], .bundles.standard.paths[], .bundles.architecture.paths[], .bundles.research.paths[], .bundles.full.paths[]' "$MANIFEST"
                ;;
            esac | sort -u
          }

          usage_files_for_bundle() {
            local bundle="$1"
            if [[ "$bundle" == minimal ]]; then
              echo usage/QUICKGUIDE.md
            else
              find usage -maxdepth 1 -name '*.md' -type f | sort
            fi
          }

          in_path_set() {
            local ref="$1"
            local path
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              if [[ "$path" == "$ref" ]]; then
                return 0
              fi
              if [[ "$path" == */ ]] && [[ "$ref" == usage/* ]]; then
                return 0
              fi
            done < <(bundle_paths "$2")
            return 1
          }

          extract_root_refs() {
            local file="$1"
            {
              grep -oE '\`[A-Za-z0-9_.-]+\.md\`' "$file" 2>/dev/null | tr -d '`' || true
              grep -oE '\]\([A-Za-z0-9_.-]+\.md\)' "$file" 2>/dev/null | sed 's/](//;s/)$//' || true
            } | grep -v '/' | sort -u
          }

          fail=0
          for bundle in minimal standard full; do
            while IFS= read -r ufile; do
              [ -f "$ufile" ] || continue
              while IFS= read -r ref; do
                [ -z "$ref" ] && continue
                if echo "$ALLOWLIST" | grep -qw "$ref"; then
                  continue
                fi
                if ! in_path_set "$ref" "$bundle"; then
                  echo "Bundled cross-ref FAIL ($bundle): $ufile references $ref (not in bundle path set)"
                  fail=1
                fi
              done < <(extract_root_refs "$ufile")
            done < <(usage_files_for_bundle "$bundle")
          done
          exit "$fail"

      - name: Provenance banners on import targets
        run: |
          set -euo pipefail
          fail=0
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find constitution ci adr usage architecture -name '*.md' -type f 2>/dev/null | sort)
          files+=(AGENTS.md .github/copilot-instructions.md governance/LOCAL_OVERLAY_TEMPLATE.md)
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            if ! head -c 500 "$f" | grep -q 'Provenance'; then
              echo "Missing Provenance banner: $f"
              fail=1
            fi
          done
          exit "$fail"

      - name: Anti-fragmentation (D5, PR only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          fail=0
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base=$(basename "$f")
            if ! grep -q "$base" README.md architecture/README.md usage/DEBUGGING_INDEX.md 2>/dev/null; then
              echo "New doc $f not linked from README.md, architecture/README.md, or usage/DEBUGGING_INDEX.md (ci/DOC_GATES.md D5)"
              fail=1
            fi
          done < <(git diff --name-only --diff-filter=A "$BASE" "$HEAD" | grep -E '^(usage|architecture)/.*\.md$' || true)
          exit "$fail"

      - name: Markdown link check (hub docs)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail './README.md' './usage/HOW_TO_IMPORT.md' './usage/ADOPTION_BUNDLES.md' './architecture/README.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
