schema_version: "1.0"
workflow:
  id: "ai-governance"
  name: "Governed cycle"
  version: "1.1.0"
  author: "AI_governance"
  description: "specify, plan, tasks, implement, then a native shell acceptance check. An approved mandate does not stop for review-spec or review-plan."

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "cursor-agent"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the change already authorized by the task mandate"
  verify:
    type: string
    required: false
    prompt: "Shell command that checks task acceptance (chosen before the run; empty uses the kit default on this repository)"

steps:
  - id: specify
    command: speckit.specify
    integration: "cursor-agent"
    input:
      args: "{{ inputs.spec }}"

  - id: plan
    command: speckit.plan
    integration: "cursor-agent"
    input:
      args: "{{ inputs.spec }}"

  - id: tasks
    command: speckit.tasks
    integration: "cursor-agent"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "cursor-agent"
    input:
      args: "{{ inputs.spec }}"

  - id: verify-acceptance
    type: shell
    timeout: 600
    run: 'TASK_ACCEPTANCE_CMD="{{ inputs.verify }}" bash ci/run_task_acceptance_check.sh'
